<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Sistema Picolés</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: rgb(255, 242, 224);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background-color: rgb(255, 253, 253);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        .logo {
            display: block;
            margin: 0 auto 20px;
            max-width: 150px;
        }
        .message-box {
            display: none;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            text-align: center;
        }
        .message-box.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

<div class="login-box">
    <img src="../api/img/sistema.png" alt="Logo do Sistema" class="logo">
    <h2 class="text-center mb-4">Acesso ao Sistema</h2>
    
    <div id="message" class="message-box"></div>

    <form id="formLogin">
        <div class="mb-3">
            <label for="username" class="form-label">Usuário</label>
            <input type="text" class="form-control" id="username" required>
        </div>
        <div class="mb-4">
            <label for="senha" class="form-label">Senha</label>
            <input type="password" class="form-control" id="senha" required>
        </div>
        <button type="submit" class="btn btn-primary w-100" style="background-color: rgb(255, 172, 63); border: none;">Entrar</button>
    </form>
</div>

<script src="../api/js/api.js"></script>
<script>
    document.getElementById("formLogin").addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const messageBox = document.getElementById("message");
        messageBox.style.display = 'none';
        
        const username = document.getElementById("username").value;
        const senha = document.getElementById("senha").value;

        try {
            const resp = await apiPost("login.php", { username, senha });

            if (resp.sucesso) {
                // Login bem-sucedido
                // Armazena o perfil no localStorage para uso futuro
                localStorage.setItem('userProfile', resp.perfil);
                
                // Redireciona para a página principal
                window.location.href = "../pages/index.html"; 
            } else {
                // Erro de credencial
                messageBox.textContent = resp.erro || "Erro desconhecido no login.";
                messageBox.className = 'message-box error';
                messageBox.style.display = 'block';
            }
        } catch (error) {
            console.error("Erro na requisição de login:", error);
            messageBox.textContent = "Não foi possível conectar ao servidor. Tente novamente.";
            messageBox.className = 'message-box error';
            messageBox.style.display = 'block';
        }
    });
</script>
</body>
</html>
