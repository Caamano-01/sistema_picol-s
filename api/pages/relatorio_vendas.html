<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Relatório de Vendas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="container mt-4">
    <h2>Relatório de Vendas</h2>

    <h3>📈 Faturamento Mensal (R$)</h3>
    <canvas id="graficoVendas" height="120"></canvas>
    
    <hr>
    
    <h3>🏆 Ranking de Picolés Mais Vendidos (Quantidade)</h3>
    <canvas id="graficoRanking" height="120"></canvas>

    <div class="mt-4">
        <a href="../index.html" class="btn btn-secondary">Voltar</a>
    </div>
</div>

<script>
async function carregarRelatorios() {
    // 1. Faturamento Mensal
    const respVendas = await fetch('relatorios.php?vendas=true');
    const dadosVendas = await respVendas.json();

    const labelsVendas = dadosVendas.map(r => r.mes);
    const valoresVendas = dadosVendas.map(r => parseFloat(r.total));

    new Chart(document.getElementById('graficoVendas'), {
        type: 'line',
        data: {
            labels: labelsVendas,
            datasets: [{
                label: 'Faturamento (R$)',
                data: valoresVendas,
                borderColor: 'rgb(75, 192, 192)',
                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                tension: 0.3
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: true } }
        }
    });

    // 2. Ranking de Picolés
    const respRanking = await fetch('relatorios.php?ranking=true');
    const dadosRanking = await respRanking.json();

    const labelsRanking = dadosRanking.map(r => r.picole);
    const valoresRanking = dadosRanking.map(r => parseInt(r.quantidade_vendida));

    new Chart(document.getElementById('graficoRanking'), {
        type: 'bar',
        data: {
            labels: labelsRanking,
            datasets: [{
                label: 'Quantidade Vendida',
                data: valoresRanking,
                backgroundColor: 'rgba(255, 99, 132, 0.6)',
                borderColor: 'rgb(255, 99, 132)',
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: true } },
            scales: { y: { beginAtZero: true } }
        }
    });
}

// Carrega os gráficos ao abrir a página
window.onload = carregarRelatorios;
</script>
</body>
</html>
