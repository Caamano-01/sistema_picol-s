<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Relatório de Vendas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<style>
    body {
        background-color: rgb(250, 242, 230);
    }
</style>
<body>
    <div class="container mt-4">
        <h2>Relatório de Vendas</h2>

        <h3>📈 Faturamento Mensal (R$)</h3>
        <div style="position: relative; height:300px;">
            <canvas id="graficoVendas"></canvas>
        </div>
        
        <hr>
        
        <h3>🏆 Ranking de Picolés Mais Vendidos (Quantidade)</h3>
        <div style="position: relative; height:300px;">
            <canvas id="graficoRanking"></canvas>
        </div>

        <div class="mt-4">
            <a href="index.html" class="btn btn-secondary">Voltar</a>
        </div>
    </div>


    <!-- Script de Verificação de Perfil -->
    <script src="../js/api.js"></script>
    <script>
      // Verifica se há algum perfil logado. Se não houver, redireciona.
      const perfil = getUserProfile();
      if (!perfil) {
        alert("Acesso negado. É necessário estar logado.");
        window.location.href = "../index.html"; // Volta para o menu principal
      }
    </script>
    <script src="../js/relatorios.js"></script>
</body>
</html>
