<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Cadastro de Picolé</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <style>
    body {
      background-color: rgb(250, 242, 230);
      font-family: Georgia, "Times New Roman", Times, serif;
    }

    form {
      background-color: rgb(255, 253, 253);
      padding: 20px;
      border-radius: 10px;
    }
  </style>
  <body>
    <!-- Script de Verificação de Perfil -->
    <script src="../js/api.js"></script>
    <script>
      // Verifica se o perfil é 'admin'. Se não for, redireciona.
      const perfil = getUserProfile();
      if (perfil !== 'admin') {
        alert("Acesso negado. Apenas administradores podem cadastrar picolés.");
        window.location.href = "../index.html"; // Volta para o menu principal
      }
    </script>
    
    <nav class="navbar navbar-dark p-3">
      <div class="container">
          <img alt="Logo" src="../img/sistema.png" >
      </div>
    </nav>


    <div class="container mt-4">
      <h2><b>Cadastro de Picolé (Admin)</b></h2>

      <form id="formPicole" class="mt-3">
        <div class="mb-3">
          <label for="nome">Nome do Picolé</label>
          <input id="nome" class="form-control" required />
        </div>

        <div class="mb-3">
          <label for="tipo">Tipo</label>
          <select id="tipo" class="form-control">
            <option value="normal">Normal</option>
            <option value="ao leite">Ao Leite</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="sabor">Sabor</label>
          <select id="sabor" class="form-control"></select>
        </div>

        <div class="mb-3">
          <label for="embalagem">Embalagem</label>
          <select id="embalagem" class="form-control"></select>
        </div>
        
        <div class="mt-4">
            <a href="index.html" class="btn btn-secondary">Voltar</a>
            <button type="submit" class="btn btn-primary" style="background-color: rgb(255, 172, 63); border: none;">Cadastrar</button>
        </div>
        
      </form>
    </div>

    <script src="../js/picoles.js"></script>
  </body>
</html>
