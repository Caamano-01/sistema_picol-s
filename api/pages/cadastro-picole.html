<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Picolé</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    body {
        background-color: rgb(250, 242, 230);
        font-family: Georgia, 'Times New Roman', Times, serif;
    }

    form {
        background-color: rgb(255, 253, 253);
        padding: 20px;
        border-radius: 10px;
    }
</style>
<body>

<div class="container mt-4">
    <h2><b>Cadastro de Picolé</b></h2>

    <form id="formPicole" class="mt-3">

        <div class="mb-3">
            <label>Nome do Picolé</label>
            <input id="nome" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Tipo</label>
            <select id="tipo" class="form-control">
                <option value="normal">Normal</option>
                <option value="ao leite">Ao Leite</option>
            </select>
        </div>

        <div class="mb-3">
            <label>Sabor</label>
            <select id="sabor" class="form-control"></select>
        </div>

        <div class="mb-3">
            <label>Embalagem</label>
            <select id="embalagem" class="form-control"></select>
        </div>

        <button class="btn btn-success">Salvar</button>

    </form>

    <div class="mt-4">
        <a href="/index.html" class="btn btn-secondary">Voltar</a>
    </div>

</div>

<script src="../js/api.js"></script>
<script src="../js/picoles.js"></script>

</body>
</html>
