<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Emitir Nota</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    body {
      background-color: rgb(250, 242, 230);
      font-family: Georgia, "Times New Roman", Times, serif;
    }

    form {
      background-color: rgb(255, 253, 253);
      padding: 20px;
      border-radius: 10px;
    }
</style>
<body>
<nav class="navbar navbar-dark p-3">
    <div class="container">
        <img alt="Logo" src="../img/sistema.png" >
    </div>
</nav>

<div class="container mt-4">

    <h2>Emissão de Nota Fiscal</h2>

    <form id="formNota" class="mt-3">

        <div class="mb-3">
            <label>Revendedor</label>
            <select id="revendedor" class="form-control"></select>
        </div>

        <div class="mb-3">
            <label>Selecionar Lote</label>
            <select id="lote" class="form-control"></select>
        </div>

        <div class="row mb-3">
            <div class="col">
                <label>Quantidade Vendida</label>
                <input id="quantidade" type="number" class="form-control">
            </div>
            <div class="col">
                <label>Valor Unitário</label>
                <input id="valor" type="number" step="0.01" class="form-control">
            </div>
        </div>

        <button class="btn btn-primary">Emitir Nota</button>

    </form>

    <div class="mt-4">
        <a href="../index.html" class="btn btn-secondary">Voltar</a>
    </div>

</div>

<script src="../js/api.js"></script>
<script src="../js/notas.js"></script>

</body>
</html>
