<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Emitir Nota</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    body {
      background-color: rgb(250, 242, 230);
      font-family: Georgia, "Times New Roman", Times, serif;
    }

    form {
      background-color: rgb(255, 253, 253);
      padding: 20px;
      border-radius: 10px;
    }
</style>
<body>
    <nav class="navbar navbar-dark p-3">
        <div class="container">
            <img alt="Logo" src="../img/sistema.png" >
        </div>
    </nav>

    <div class="container mt-4">

        <h2>Emissão de Nota Fiscal (Vendedor e Admin)</h2>

        <form id="formNota" class="mt-3">

            <div class="mb-3">
                <label>Revendedor</label>
                <select id="revendedor" class="form-control"></select>
            </div>

            <div class="mb-3">
                <label>Selecionar Lote</label>
                <select id="lote" class="form-control"></select>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <label>Quantidade Vendida</label>
                    <input id="quantidade" type="number" class="form-control" required min="1">
                </div>
                <div class="col">
                    <label>Valor Unitário</label>
                    <input id="valor" type="number" class="form-control" step="0.01" required min="0.01">
                </div>
            </div>

            <div class="mt-4">
                <a href="../pages/index.html" class="btn btn-secondary">Voltar</a>
                <button type="submit" class="btn btn-primary" style="background-color: rgb(255, 172, 63); border: none;">Emitir Nota</button>
            </div>

        </form>
    </div>

    <!-- Script de Verificação de Perfil -->
    <script src="../js/api.js"></script>
    <script>
      // Verifica se há algum perfil logado. Se não houver, redireciona.
      const perfil = getUserProfile();
      if (!perfil) {
        alert("Acesso negado. É necessário estar logado.");
        window.location.href = "index.html"; // Volta para o menu principal
      }
    </script>
    <script src="../js/notas.js"></script>
</body>
</html>
