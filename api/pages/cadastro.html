<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Cadastro</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <style>
    body {
      background: linear-gradient(135deg, #f0f4ff, #fafafa);
      min-height: 100vh;
      font-family: "Segoe UI", sans-serif;
    }

    nav img {
      height: 75px;
    }

    nav .container {
      display: flex;
      justify-content: center;
      align-items: center;
    }


    h1 {
      margin: 10px 0 15px 20px;
      font-weight: 700;
    }

    /* ===== MENU DAS ABAS ===== */
    .nav-underline .nav-link {
      font-size: 17px;
      padding: 12px 18px;
      color: #555;
      transition: 0.3s ease;
      position: relative;
    }

    .nav-underline .nav-link:hover {
      color: #ff9400;
      transform: translateY(-2px);
    }

    .nav-underline .nav-link.active {
      color: #ff9400;
      font-weight: 600;
    }

    /* Barra animada embaixo da aba ativa */
    .nav-underline .nav-link.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      width: 100%;
      background: #ff9400;
      border-radius: 3px;
      animation: slideIn 0.3s ease forwards;
    }

    @keyframes slideIn {
      from { width: 0; }
      to { width: 100%; }
    }

    /* ===== CONTEÚDO ===== */
    .tab-content {
      padding: 30px;
      background: #fff;
      border-radius: 12px;
      margin-top: 20px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.12);
    }

    /* Animação suave de entrada */
    .tab-pane {
      display: none;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .tab-pane.active {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    /* Inputs suaves */
    input, select {
      border-radius: 8px !important;
    }

    /* Responsividade */
    @media (max-width: 768px) {
      .nav-underline {
        flex-wrap: wrap;
        gap: 5px;
      }
      .nav-underline .nav-link {
        font-size: 15px;
        padding: 8px 12px;
      }
    }
  </style>
</head>

<body>
  <nav class="navbar p-3">
    <div class="container">
      <img alt="Logo" src="../img/sistema.png">
    </div>
  </nav>

  <h1><b>Cadastros</b></h1>

  <!-- MENU -->
  <ul class="nav nav-underline px-3" id="tabsMenu">
    <li class="nav-item"><a class="nav-link active" data-tab="picoles">Picolés</a></li>
    <li class="nav-item"><a class="nav-link" data-tab="lote">Lotes</a></li>
    <li class="nav-item"><a class="nav-link" data-tab="embalagem">Embalagem</a></li>
    <li class="nav-item"><a class="nav-link" data-tab="sabor">Sabor</a></li>
    <li class="nav-item"><a class="nav-link" data-tab="ingredientes">Ingredientes</a></li>
    <li class="nav-item"><a class="nav-link" data-tab="adtivo">Aditivo-nutritivo</a></li>
    <li class="nav-item"><a class="nav-link" data-tab="conservante">Conservantes</a></li>
    <li class="nav-item"><a class="nav-link" data-tab="revendedor">Revendedores</a></li>
  </ul>

  <!-- CONTEÚDO -->
  <div class="container tab-content">

    <!-- PICOLÉS -->
    <div id="picoles" class="tab-pane active">
      <form id="form-picole">
        <label class="form-label">Nome do Picolé:</label>
        <input type="text" id="nome-picole" class="form-control" required />
        <br />

        <label for="tipo">Tipo:</label>
        <select id="tipo-picole" class="form-select" required>
          <option value="" disabled selected>Selecione o tipo</option>
          <option value="normal">Normal</option>
          <option value="ao_leite">Ao leite</option>
        </select>
        <br />

        <label class="form-label">Sabor:</label>
        <select id="sabor-picole" class="form-select" required></select>
        <br />

        <label class="form-label">Tipo de embalagem:</label>
        <select id="embalagem-picole" class="form-select" required></select>
        <br />

        <div id="box-ingredientes" style="display:none;">
          <label class="form-label">Ingredientes:</label>
          <select id="ingredientes-picole" class="form-select" multiple required></select>
          <small class="text-muted">Segure CTRL (ou clique múltiplo no celular) para selecionar vários.</small>
          <br><br>
        </div>

        <div id="box-adtivo" style="display:none;">
          <label class="form-label">Aditivo Nutritivo:</label>
          <select id="adtivo-picole" class="form-select"></select>
          <br><br>
        </div>

        <div id="box-conservante" style="display:none;">
          <label class="form-label">Conservante:</label>
          <select id="conservante-picole" class="form-select"></select>
          <br><br>
        </div>

        <button class="btn btn-warning">Cadastrar Picolé</button>
      </form>
    </div>

    <!-- LOTES -->
    <div id="lote" class="tab-pane">
      <form id="form-lote">
        <label>Data de produção:</label>
        <input type="date" id="data-producao" class="form-control" required />
        <br />

        <label>Quantidade:</label>
        <input type="number" id="quantidade" class="form-control" required />
        <br />

        <label>Picolé:</label>
        <select id="picole" class="form-select" required></select>
        <br />

        <button class="btn btn-warning">Cadastrar Lote</button>
      </form>
    </div>

    <!-- EMBALAGEM -->
    <div id="embalagem" class="tab-pane">
      <form id="form-embalagem">
        <label class="form-label">Tipo de Embalagem:</label>
        <input type="text" id="tipo-embalagem" class="form-control" required />
        <br />
        <button class="btn btn-warning">Cadastrar Embalagem</button>
      </form>
    </div>

    <!-- SABOR -->
    <div id="sabor" class="tab-pane">
      <form id="form-sabor">
        <label class="form-label">Nome do Sabor:</label>
        <input type="text" id="nome-sabor" class="form-control" required />
        <br />
        <button class="btn btn-warning">Cadastrar Sabor</button>
      </form>
    </div>

    <!-- INGREDIENTES -->
    <div id="ingredientes" class="tab-pane">
      <form id="form-ingredientes">
        <label class="form-label">Nome do Ingrediente:</label>
        <input type="text" id="nome-ingrediente" class="form-control" required />
        <br />
        <button class="btn btn-warning">Cadastrar Ingrediente</button>
      </form>
    </div>

    <!-- ADITIVO -->
    <div id="adtivo" class="tab-pane">
      <form id="form-adtivo">
        <label class="form-label">Nome do Aditivo-nutritivo:</label>
        <input type="text" id="nome-adtivo" class="form-control" required />
        <br />
        <button class="btn btn-warning">Cadastrar Aditivo-nutritivo</button>
      </form>
    </div>

    <!-- CONSERVANTE -->
    <div id="conservante" class="tab-pane">
      <form id="form-conservante">
        <label class="form-label">Nome do Conservante:</label>
        <input type="text" id="nome-conservante" class="form-control" required />
        <br />
        <button class="btn btn-warning">Cadastrar Conservante</button>
      </form>
    </div>

    <!-- REVENDEDOR -->
    <div id="revendedor" class="tab-pane">
      <form id="form-revendedor">
        <label class="form-label">Razão social:</label>
        <input type="text" id="razao-social" class="form-control" required />
        <br />

        <label>CNPJ:</label>
        <input type="text" id="cnpj" class="form-control" required />
        <br />

        <label>Endereço:</label>
        <input type="text" id="endereco" class="form-control" required />
        <br />

        <button class="btn btn-warning">Cadastrar Revendedor</button>
      </form>
    </div>

  </div>

  <script src="../js/api.js"></script>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    function carregarSelect(url, elementoId, campo) {
      fetch(url)
        .then(r => r.json())
        .then(lista => {
          // ⚠️ Adiciona a opção inicial
          let options = `<option value="" disabled selected>Selecione...</option>`; 
          options += lista.map(item => `<option value="${item.id}">${item[campo]}</option>`).join("");
          document.getElementById(elementoId).innerHTML = options;
        })
        .catch(err => {
          console.error(`❌ Erro ao carregar ${elementoId}: URL: ${url}`, err);
          document.getElementById(elementoId).innerHTML = `<option value="" disabled>Erro ao carregar dados</option>`;
        });
    }

    // ===== Inicializar selects =====
    carregarSelect("../routes/ingrediente.php", "ingredientes-picole", "nome");
    carregarSelect("../routes/aditivo_nutritivo.php", "adtivo-picole", "nome");
    carregarSelect("../routes/conservante.php", "conservante-picole", "nome");
    carregarSelect("../routes/sabor.php", "sabor-picole", "nome");
    carregarSelect("../routes/embalagem.php", "embalagem-picole", "tipo");
    // 🚀 Adicionado o carregamento de Picolé para o formulário de Lote
    carregarSelect("../routes/picole.php", "picole", "nome");

    // ===== Alternância de abas =====
    const links = document.querySelectorAll(".nav-link");
    const tabs = document.querySelectorAll(".tab-pane");

    links.forEach(link => {
      link.addEventListener("click", () => {
        const tab = link.dataset.tab;

        // Atualiza seleção visual do menu
        links.forEach(l => l.classList.remove("active"));
        link.classList.add("active");

        // Troca de abas com animação
        tabs.forEach(t => t.classList.remove("active"));
        document.getElementById(tab).classList.add("active");
      });
    });

    // ===== Exibição condicional de caixas no cadastro de picolé =====
    const boxIngredientes = document.getElementById("box-ingredientes");
    const boxAdtivo = document.getElementById("box-adtivo");
    const boxConservante = document.getElementById("box-conservante");
    const tipoPicole = document.getElementById("tipo-picole");

    tipoPicole.addEventListener("change", () => {
      const tipo = tipoPicole.value;

      // Ingredientes SEMPRE aparecem
      boxIngredientes.style.display = "block";

      // Exibe apenas a caixa correspondente
      boxAdtivo.style.display = tipo === "normal" ? "block" : "none";
      boxConservante.style.display = tipo === "ao_leite" ? "block" : "none";
    });

    // ===== Função auxiliar para envio de dados (utiliza a API do api.js) =====
    async function enviarDados(endpoint, dados) {
      // apiPost está definida no api.js
      const resultado = await apiPost(endpoint, dados);

      if (!resultado.sucesso) {
        console.error(`Falha no POST para ${endpoint}:`, resultado);
      }
      return resultado;
    }

    // Função auxiliar para extrair múltiplos valores de um select
    function getSelectValues(select) {
        const result = [];
        const options = select.options;
        for (let i = 0; i < options.length; i++) {
            if (options[i].selected) {
                result.push(options[i].value);
            }
        }
        return result;
    }

    // ===== 🚀 Lógica de envio de formulários (Substitui o forms.forEach) =====

    // --- PICOLÉS (Lógica de Múltiplas Chamadas) ---
    document.getElementById("form-picole").addEventListener("submit", async (e) => {
      e.preventDefault();

      const nome = document.getElementById("nome-picole").value;
      const tipo = document.getElementById("tipo-picole").value;
      const id_sabor = document.getElementById("sabor-picole").value;
      const id_embalagem = document.getElementById("embalagem-picole").value;

      // 1 — cadastrar o picolé
      const resPicole = await apiPost("picole.php", {
        nome,
        tipo,
        id_sabor,
        id_embalagem
      });
        
      if (!resPicole.sucesso) {
        alert("Erro ao cadastrar picolé.");
        return;
      }

      const id_picole = resPicole.id;

      // 2 — cadastrar ingredientes
      const ingredientes = Array.from(
        document.getElementById("ingredientes-picole").selectedOptions
      ).map(opt => opt.value);

      for (const id_ing of ingredientes) {
        await apiPost("picole_ingrediente.php", {
         id_picole,                id_ingrediente: id_ing
        });
      }

      alert("Picolé cadastrado com sucesso!");
      e.target.reset();
    });

    // --- OUTROS FORMULÁRIOS SIMPLES ---

    const formsSimples = [
      { id: "form-lote", endpoint: "lote.php", reloadSelect: "picole" },
      { id: "form-embalagem", endpoint: "embalagem.php", field: "tipo", frontendField: "tipo-embalagem", reloadSelect: "embalagem-picole" },
      { id: "form-sabor", endpoint: "sabor.php", field: "nome", frontendField: "nome-sabor", reloadSelect: "sabor-picole" },
      { id: "form-adtivo", endpoint: "aditivo_nutritivo.php", field: "nome", frontendField: "nome-adtivo", reloadSelect: "adtivo-picole" },
      { id: "form-conservante", endpoint: "conservante.php", field: "nome", frontendField: "nome-conservante", reloadSelect: "conservante-picole" }
      // O formulário de Ingredientes (tabela `ingredientes`) não pode ser cadastrado
      // pois o arquivo `ingrediente.php` não tem lógica de POST.
    ];

    formsSimples.forEach(item => {
        const form = document.getElementById(item.id);
        if (!form) return;

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            
            let dados = {};
            let campoValor = "";

            if (item.id === "form-lote") {
                dados = {
                    id_picole: document.getElementById("picole").value,
                    quantidade: document.getElementById("quantidade").value,
                    data_producao: document.getElementById("data-producao").value,
                };
            } else {
                campoValor = document.getElementById(item.frontendField).value;
                dados[item.field] = campoValor;
            }

            const resultado = await apiPost(item.endpoint, dados);

            if (resultado.sucesso) {
                alert(`Cadastro realizado com sucesso!`);
                e.target.reset();
                if (item.reloadSelect) {
                    // Recarrega o select que depende deste cadastro
                    carregarSelect(`../routes/${item.endpoint}`, item.reloadSelect, item.field || 'nome' || 'tipo');
                }
            } else {
                alert(`Falha ao cadastrar no endpoint ${item.endpoint}.`);
            }
        });
    });

    // --- REVENDEDOR (Tratamento especial por causa dos campos) ---
    document.getElementById("form-revendedor").addEventListener("submit", async (e) => {
        e.preventDefault();
        const nome = document.getElementById("razao-social").value;
        const cnpj = document.getElementById("cnpj").value;
        const endereco = document.getElementById("endereco").value;
        
        // revendedor.php espera "nome", "cnpj", "endereco"
        const resultado = await apiPost("revendedor.php", {
            nome: nome,
            cnpj: cnpj,
            endereco: endereco,
        });

        if (resultado.sucesso) {
            alert("Revendedor cadastrado com sucesso!");
            document.getElementById("form-revendedor").reset();
        } else {
            alert("Falha ao cadastrar Revendedor.");
        }
    });
  </script>
</body>
</html>
